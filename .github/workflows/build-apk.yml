name: Build e testes do J.A.R.V.I.S. Nova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JARVIS-NOVA-*-fonte.zip'
      - '.github/workflows/build-apk.yml'
      - 'app.js'
      - 'main.js'
      - 'index.html'
      - 'style.css'
      - 'patch_*.py'
      - 'Jarvis*.java'
      - 'MainActivity.java'
      - 'package.json'
      - 'VERSAO.json'

permissions:
  contents: read

concurrency:
  group: jarvis-nova-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configurar Java para o Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair código-fonte enviado ao repositório
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'JARVIS-NOVA-*-fonte.zip' -print | sort | tail -n 1)"
          if [ -n "$ZIP" ]; then
            rm -rf /tmp/jarvis-source
            mkdir -p /tmp/jarvis-source
            unzip -q "$ZIP" -d /tmp/jarvis-source
            # The ZIP may contain a top-level folder with a versioned name, or files directly at its root.
            PACKAGE="$(find /tmp/jarvis-source -type f -name package.json -not -path '*/node_modules/*' -print -quit)"
            if [ -z "$PACKAGE" ]; then
              echo "ERRO: package.json não encontrado dentro de $ZIP. Conteúdo do ZIP:"
              find /tmp/jarvis-source -maxdepth 4 -type f | head -200
              exit 1
            fi
            SRC="$(dirname "$PACKAGE")"
            echo "Fonte encontrada em: $SRC"
            find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;
          fi
          test -f package.json || { echo 'Envie JARVIS-NOVA-*-fonte.zip para a raiz do repositório.'; exit 1; }
          for f in JarvisLocalAIPlugin.java MainActivity.java patch_manifest.py patch_gradle.py; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo obrigatório ausente após extrair a fonte: $f"
              echo "Arquivos na raiz do repositório:"
              ls -la
              exit 1
            fi
          done

      - name: Instalar dependências Node
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Testes estáticos e regressão
        run: npm run test:all

      - name: Preparar os recursos web do aplicativo
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html style.css app.js apps.js www/

      - name: Gerar estrutura nativa do Android
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: Aplicar identidade, permissões, versão e detector local
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/jarvis/nova
          mkdir -p "$D"
          cp MainActivity.java JarvisBackgroundPlugin.java JarvisService.java JarvisUtilPlugin.java JarvisLocalAIPlugin.java JarvisAlarmReceiver.java JarvisAlarmScheduler.java JarvisBootReceiver.java JarvisNotificationListener.java "$D/"
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 patch_gradle.py android/app/build.gradle
          python3 patch_android_version.py android/app/build.gradle VERSAO.json
          python3 patch_visual.py android

      - name: Compilar APK debug
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "Primeira compilação falhou; tentando novamente sem as personalizações de splash/ícone."
            python3 ../patch_visual.py . desfazer
            ./gradlew assembleDebug --no-daemon
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Publicar APK e checksum
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nova-1.3.4-APK
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-sha256.txt
          retention-days: 14
